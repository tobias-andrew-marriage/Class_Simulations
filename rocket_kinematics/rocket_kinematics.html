<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1D Kinematics: Rocket Integration</title>
    <!-- Chart.js for plotting -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- KaTeX for math rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <style>
        :root {
            --bg-color: #f4f4f9;
            --panel-bg: #ffffff;
            --text-main: #333333;
            --accent: #3498db;
            --accent-hover: #2980b9;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            height: 100vh;
            box-sizing: border-box;
            gap: 20px;
        }
        h1, h2, h3 { margin-top: 0; }
        .left-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 50%;
        }
        .right-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: var(--panel-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            max-width: 50%;
        }
        .panel {
            background: var(--panel-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
        }
        canvas#simCanvas {
            width: 100%;
            height: 250px;
            background: #040714;
            border-radius: 8px;
            border: 1px solid #1e293b;
        }
        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            flex: 1;
        }
        .control-group {
            display: flex;
            flex-direction: column;
        }
        .control-group label {
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 0.9em;
        }
        .control-group input[type="range"] {
            width: 100%;
        }
        .value-display {
            font-size: 0.9em;
            color: var(--accent);
            font-weight: bold;
        }
        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        button {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background-color: var(--accent);
            color: white;
            transition: background 0.2s;
        }
        button:hover { background-color: var(--accent-hover); }
        button.btn-stop { background-color: #e74c3c; }
        button.btn-stop:hover { background-color: #c0392b; }
        button.btn-reset { background-color: #95a5a6; }
        button.btn-reset:hover { background-color: #7f8c8d; }
        .chart-container {
            position: relative;
            flex: 1;
            min-height: 0;
        }
        .math-header {
            font-size: 1.1em;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
            text-align: center;
        }
        .math-equations {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 5px;
        }
        .math-equations .katex-display {
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="left-column">
        <!-- Simulation Canvas -->
        <div class="panel">
            <h2 style="font-size: 1.2em;">Rocket Kinematics Simulation</h2>
            <canvas id="simCanvas" width="800" height="250"></canvas>
            <div id="liveStats" style="margin-top: 10px; font-family: monospace; font-size: 1.1em; display: flex; justify-content: space-between;">
                <span>Time: 0.00 s</span>
                <span>Mass: 0.0 kg</span>
            </div>
        </div>

        <!-- Controls -->
        <div class="panel" style="flex: 1;">
            <div class="math-header">
                <div style="margin-bottom: 5px; font-weight: 600;">Tsiolkovsky Equations:</div>
                <div class="math-equations">
                    <div>$$a(t) = \frac{v_{ex} m'}{m_0 - m' t}$$</div>
                    <div>$$v(t) = v_{ex} \ln\left(\frac{m_0}{m_0-m't}\right)$$</div>
                    <div>$$m(t) = m_0 - m' t$$</div>
                </div>
            </div>
            
            <div class="controls-grid">
                <div class="control-group">
                    <div style="display: flex; justify-content: space-between;">
                        <label>Initial Mass $m_0$ (kg)</label>
                        <div class="value-display" id="m0-val">1000</div>
                    </div>
                    <input type="range" id="m0" min="100" max="2000" step="10" value="1000">
                </div>
                <div class="control-group">
                    <div style="display: flex; justify-content: space-between;">
                        <label>Burn Rate $m'$ (kg/s)</label>
                        <div class="value-display" id="mPrime-val">20</div>
                    </div>
                    <input type="range" id="mPrime" min="1" max="100" step="1" value="20">
                </div>
                <div class="control-group">
                    <div style="display: flex; justify-content: space-between;">
                        <label>Exhaust Vel. $v_{ex}$ (m/s)</label>
                        <div class="value-display" id="vex-val">100</div>
                    </div>
                    <input type="range" id="vex" min="10" max="500" step="10" value="100">
                </div>
                <div class="control-group">
                    <div style="display: flex; justify-content: space-between;">
                        <label>Init. Position $x_0$ (m)</label>
                        <div class="value-display" id="x0-val">0</div>
                    </div>
                    <input type="range" id="x0" min="0" max="1000" step="10" value="0">
                </div>
                <div class="control-group">
                    <div style="display: flex; justify-content: space-between;">
                        <label>Init. Velocity $v_0$ (m/s)</label>
                        <div class="value-display" id="v0-val">0</div>
                    </div>
                    <input type="range" id="v0" min="0" max="200" step="5" value="0">
                </div>
                <div class="control-group">
                    <div style="display: flex; justify-content: space-between;">
                        <label>Fuel Mass Fraction (%)</label>
                        <div class="value-display" id="fuelFrac-val">80</div>
                    </div>
                    <input type="range" id="fuelFrac" min="10" max="95" step="5" value="80">
                </div>
            </div>

            <div class="btn-row">
                <button id="btnStart">Start / Resume</button>
                <button id="btnPause" class="btn-stop">Pause</button>
                <button id="btnReset" class="btn-reset">Reset</button>
            </div>
        </div>
    </div>

    <div class="right-column">
        <h3 style="margin: 0; font-size: 1.3em; font-weight: 700; color: #1e293b;">Kinematic Plots (Integration over Time)</h3>
        
        <div class="chart-container">
            <canvas id="aChart"></canvas>
        </div>
        <div class="chart-container">
            <canvas id="vChart"></canvas>
        </div>
        <div class="chart-container">
            <canvas id="xChart"></canvas>
        </div>
    </div>

    <script>
        // Render KaTeX for UI math
        renderMathInElement(document.body, {
            delimiters: [
                {left: "$$", right: "$$", display: true},
                {left: "$", right: "$", display: false}
            ]
        });

        // UI Elements
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const liveStats = document.getElementById('liveStats');

        const inputs = {
            m0: document.getElementById('m0'),
            mPrime: document.getElementById('mPrime'),
            vex: document.getElementById('vex'),
            x0: document.getElementById('x0'),
            v0: document.getElementById('v0'),
            fuelFrac: document.getElementById('fuelFrac')
        };
        const displays = {
            m0: document.getElementById('m0-val'),
            mPrime: document.getElementById('mPrime-val'),
            vex: document.getElementById('vex-val'),
            x0: document.getElementById('x0-val'),
            v0: document.getElementById('v0-val'),
            fuelFrac: document.getElementById('fuelFrac-val')
        };

        // Sync inputs with displays
        for (let key in inputs) {
            inputs[key].addEventListener('input', () => {
                displays[key].innerText = inputs[key].value;
                if (!isRunning && t === 0) resetSim();
            });
        }

        // Physics State
        let isRunning = false;
        let lastTime = 0;
        
        let t = 0;
        let m = 0;
        let x = 0;
        let v = 0;
        let a = 0;
        let emptyMass = 0;

        // Chart Data Arrays
        let chartTime = [];
        let chartA = [];
        let chartV = [];
        let chartX = [];

        // Chart Configuration Generator
        function makeChartOptions(yLabel) {
            return {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                elements: { point: { radius: 0 }, line: { borderWidth: 2.5, tension: 0.1 } },
                scales: { 
                    x: { 
                        type: 'linear', 
                        title: { 
                            display: true, 
                            text: 'Time (s)',
                            font: { size: 14, weight: 'bold' },
                            color: '#334155'
                        },
                        ticks: {
                            font: { size: 12, weight: 'bold' },
                            color: '#475569'
                        },
                        grid: {
                            color: 'rgba(0, 0, 0, 0.06)'
                        }
                    },
                    y: { 
                        min: 0,
                        title: {
                            display: true,
                            text: yLabel,
                            font: { size: 14, weight: 'bold' },
                            color: '#334155'
                        },
                        ticks: {
                            font: { size: 12, weight: 'bold' },
                            color: '#475569'
                        },
                        grid: {
                            color: 'rgba(0, 0, 0, 0.06)'
                        }
                    }
                },
                plugins: { 
                    legend: { 
                        display: true, 
                        position: 'top',
                        labels: {
                            font: { size: 15, weight: 'bold' },
                            color: '#0f172a',
                            boxWidth: 26,
                            padding: 8
                        }
                    } 
                }
            };
        }

        const aChart = new Chart(document.getElementById('aChart'), {
            type: 'line',
            data: { labels: chartTime, datasets: [{ label: 'Acceleration (m/s²)', data: chartA, borderColor: '#e74c3c' }] },
            options: makeChartOptions('Acceleration (m/s²)')
        });
        const vChart = new Chart(document.getElementById('vChart'), {
            type: 'line',
            data: { labels: chartTime, datasets: [{ label: 'Velocity (m/s)  [∫ a dt]', data: chartV, borderColor: '#f39c12' }] },
            options: makeChartOptions('Velocity (m/s)')
        });
        const xChart = new Chart(document.getElementById('xChart'), {
            type: 'line',
            data: { labels: chartTime, datasets: [{ label: 'Position (m)  [∫ v dt]', data: chartX, borderColor: '#2980b9' }] },
            options: makeChartOptions('Position (m)')
        });

        function updateCharts() {
            aChart.update();
            vChart.update();
            xChart.update();
        }

        function resetSim() {
            isRunning = false;
            
            // Read initial parameters
            const m0 = parseFloat(inputs.m0.value);
            const fuelFrac = parseFloat(inputs.fuelFrac.value) / 100.0;
            t = 0;
            m = m0;
            emptyMass = m0 * (1.0 - fuelFrac); // burnout occurs when fuel is depleted
            x = parseFloat(inputs.x0.value);
            v = parseFloat(inputs.v0.value);
            
            const mPrime = parseFloat(inputs.mPrime.value);
            const vex = parseFloat(inputs.vex.value);
            a = (vex * mPrime) / m;

            // Clear Chart Data
            chartTime.length = 0;
            chartA.length = 0;
            chartV.length = 0;
            chartX.length = 0;
            
            recordData();
            updateCharts();
            drawCanvas();
            updateStats();
        }

        function recordData() {
            chartTime.push(t);
            chartA.push(a);
            chartV.push(v);
            chartX.push(x);
        }

        function updateStats() {
            liveStats.innerHTML = `<span>Time: ${t.toFixed(2)} s</span><span>Mass: ${m.toFixed(1)} kg</span>`;
        }

        // Starfield and Celestial Objects
        const STARS_COUNT = 90;
        const stars = [];
        for (let i = 0; i < STARS_COUNT; i++) {
            stars.push({
                x: Math.random() * 2000,
                y: Math.random() * 160 + 10,
                radius: Math.random() * 1.4 + 0.6,
                baseAlpha: Math.random() * 0.5 + 0.5,
                twinkleSpeed: Math.random() * 3 + 1,
                phase: Math.random() * Math.PI * 2,
                parallax: Math.random() * 0.12 + 0.04,
                color: ['#ffffff', '#e0f2fe', '#fef3c7', '#fbcfe8', '#ede9fe'][Math.floor(Math.random() * 5)]
            });
        }

        const celestialBodies = [
            { type: 'moon', x: 250, y: 55, radius: 18, parallax: 0.22 },
            { type: 'mars', x: 950, y: 95, radius: 24, parallax: 0.28 },
            { type: 'saturn', x: 1800, y: 65, radius: 32, parallax: 0.20 },
            { type: 'earth', x: 2650, y: 85, radius: 28, parallax: 0.32 },
            { type: 'jupiter', x: 3500, y: 70, radius: 38, parallax: 0.24 }
        ];
        const CELESTIAL_LOOP = 4200;

        function drawPlanet(ctx, type, cx, cy, r) {
            ctx.save();
            if (type === 'moon') {
                const grad = ctx.createRadialGradient(cx - r*0.3, cy - r*0.3, r*0.1, cx, cy, r);
                grad.addColorStop(0, '#f8fafc');
                grad.addColorStop(0.6, '#94a3b8');
                grad.addColorStop(1, '#334155');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI * 2);
                ctx.fill();

                // Craters
                ctx.fillStyle = 'rgba(51, 65, 85, 0.45)';
                const craters = [[-0.3, -0.2, 0.2], [0.2, 0.3, 0.22], [-0.1, 0.35, 0.15], [0.3, -0.3, 0.18]];
                craters.forEach(([ox, oy, cr]) => {
                    ctx.beginPath();
                    ctx.arc(cx + ox*r, cy + oy*r, cr*r, 0, Math.PI * 2);
                    ctx.fill();
                });
            } else if (type === 'mars') {
                const grad = ctx.createRadialGradient(cx - r*0.35, cy - r*0.35, r*0.1, cx, cy, r);
                grad.addColorStop(0, '#fb923c');
                grad.addColorStop(0.55, '#c2410c');
                grad.addColorStop(1, '#431407');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI * 2);
                ctx.fill();

                // Subtle surface shading
                ctx.fillStyle = 'rgba(67, 20, 7, 0.3)';
                ctx.beginPath();
                ctx.arc(cx - r*0.1, cy + r*0.2, r*0.4, 0, Math.PI * 2);
                ctx.fill();

                // Polar ice cap
                ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
                ctx.beginPath();
                ctx.ellipse(cx, cy - r*0.82, r*0.35, r*0.12, 0, 0, Math.PI * 2);
                ctx.fill();
            } else if (type === 'saturn') {
                // Back half of rings
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(-0.32);
                ctx.strokeStyle = 'rgba(234, 179, 8, 0.55)';
                ctx.lineWidth = r * 0.35;
                ctx.beginPath();
                ctx.ellipse(0, 0, r * 2.2, r * 0.55, 0, Math.PI, Math.PI * 2);
                ctx.stroke();
                ctx.strokeStyle = 'rgba(254, 240, 138, 0.35)';
                ctx.lineWidth = r * 0.1;
                ctx.stroke();
                ctx.restore();

                // Planet Body
                const grad = ctx.createRadialGradient(cx - r*0.3, cy - r*0.3, r*0.1, cx, cy, r);
                grad.addColorStop(0, '#fef08a');
                grad.addColorStop(0.4, '#eab308');
                grad.addColorStop(0.8, '#a16207');
                grad.addColorStop(1, '#451a03');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI * 2);
                ctx.fill();

                // Front half of rings
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(-0.32);
                ctx.strokeStyle = 'rgba(234, 179, 8, 0.75)';
                ctx.lineWidth = r * 0.35;
                ctx.beginPath();
                ctx.ellipse(0, 0, r * 2.2, r * 0.55, 0, 0, Math.PI);
                ctx.stroke();
                ctx.strokeStyle = 'rgba(254, 240, 138, 0.5)';
                ctx.lineWidth = r * 0.1;
                ctx.stroke();
                ctx.restore();
            } else if (type === 'earth') {
                // Glow
                ctx.save();
                ctx.shadowColor = '#38bdf8';
                ctx.shadowBlur = 10;
                const grad = ctx.createRadialGradient(cx - r*0.3, cy - r*0.3, r*0.1, cx, cy, r);
                grad.addColorStop(0, '#38bdf8');
                grad.addColorStop(0.45, '#0284c7');
                grad.addColorStop(0.85, '#0369a1');
                grad.addColorStop(1, '#082f49');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                // Continents
                ctx.fillStyle = 'rgba(34, 197, 94, 0.6)';
                ctx.beginPath();
                ctx.ellipse(cx - r*0.2, cy - r*0.15, r*0.35, r*0.22, 0.4, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(cx + r*0.25, cy + r*0.25, r*0.3, r*0.2, -0.3, 0, Math.PI * 2);
                ctx.fill();

                // Clouds
                ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
                ctx.beginPath();
                ctx.ellipse(cx, cy - r*0.25, r*0.45, r*0.1, -0.2, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(cx - r*0.1, cy + r*0.3, r*0.4, r*0.08, 0.15, 0, Math.PI * 2);
                ctx.fill();
            } else if (type === 'jupiter') {
                const grad = ctx.createRadialGradient(cx - r*0.3, cy - r*0.3, r*0.1, cx, cy, r);
                grad.addColorStop(0, '#ffedd5');
                grad.addColorStop(0.45, '#ea580c');
                grad.addColorStop(0.8, '#9a3412');
                grad.addColorStop(1, '#431407');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI * 2);
                ctx.fill();

                // Band stripes clipped
                ctx.save();
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI * 2);
                ctx.clip();
                ctx.fillStyle = 'rgba(124, 45, 18, 0.55)';
                ctx.fillRect(cx - r, cy - r*0.45, r*2, r*0.22);
                ctx.fillRect(cx - r, cy + r*0.1, r*2, r*0.25);
                // Great Red Spot
                ctx.fillStyle = 'rgba(185, 28, 28, 0.85)';
                ctx.beginPath();
                ctx.ellipse(cx + r*0.3, cy + r*0.22, r*0.25, r*0.14, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
            ctx.restore();
        }

        function drawCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Camera tracks the rocket smoothly, keeping it on screen
            const cameraX = Math.max(0, x - canvas.width * 0.2);
            
            // Sky gradient
            const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            skyGrad.addColorStop(0, '#040714');
            skyGrad.addColorStop(0.7, '#091026');
            skyGrad.addColorStop(1, '#111827');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Subtle background nebula
            const nebula = ctx.createRadialGradient(canvas.width * 0.65, 60, 20, canvas.width * 0.65, 60, 280);
            nebula.addColorStop(0, 'rgba(99, 102, 241, 0.12)');
            nebula.addColorStop(0.5, 'rgba(168, 85, 247, 0.06)');
            nebula.addColorStop(1, 'rgba(15, 23, 42, 0)');
            ctx.fillStyle = nebula;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Stars with parallax & gentle twinkle
            const animTime = performance.now() * 0.001;
            stars.forEach(star => {
                const starX = ((star.x - cameraX * star.parallax) % canvas.width + canvas.width) % canvas.width;
                const alpha = star.baseAlpha * (0.65 + 0.35 * Math.sin(animTime * star.twinkleSpeed + star.phase));
                ctx.fillStyle = star.color;
                ctx.globalAlpha = Math.max(0.15, Math.min(1, alpha));
                ctx.beginPath();
                ctx.arc(starX, star.y, star.radius, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;

            // Draw Planets with parallax
            celestialBodies.forEach(body => {
                let screenX = (body.x - cameraX * body.parallax) % CELESTIAL_LOOP;
                if (screenX < -150) screenX += CELESTIAL_LOOP;
                if (screenX <= canvas.width + 150) {
                    drawPlanet(ctx, body.type, screenX, body.y, body.radius);
                }
            });

            // Draw Ground Surface
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, canvas.height - 30, canvas.width, 30);

            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(0, canvas.height - 30);
            ctx.lineTo(canvas.width, canvas.height - 30);
            ctx.stroke();

            // Draw Grid 
            const startGrid = Math.floor(cameraX / 100) * 100;
            ctx.fillStyle = '#94a3b8';
            ctx.strokeStyle = 'rgba(56, 189, 248, 0.4)';
            ctx.lineWidth = 1;
            ctx.font = '11px sans-serif';
            ctx.textAlign = 'center';
            for (let gx = startGrid; gx < startGrid + canvas.width + 100; gx += 100) {
                const screenX = gx - cameraX;
                ctx.beginPath();
                ctx.moveTo(screenX, canvas.height - 30);
                ctx.lineTo(screenX, canvas.height - 22);
                ctx.stroke();
                ctx.fillText(gx + 'm', screenX, canvas.height - 8);
            }

            // Draw Rocket
            const screenX = x - cameraX;
            const rocketY = canvas.height - 45;

            ctx.save();
            ctx.translate(screenX, rocketY);

            // Thrust Flame
            if (m > emptyMass && isRunning) {
                // Outer flame
                ctx.fillStyle = '#f97316';
                ctx.beginPath();
                ctx.moveTo(-20, -6);
                const flameLen = 25 + Math.random() * 25;
                ctx.lineTo(-20 - flameLen, 0);
                ctx.lineTo(-20, 6);
                ctx.fill();
                // Inner core flame
                ctx.fillStyle = '#fef08a';
                ctx.beginPath();
                ctx.moveTo(-20, -3);
                ctx.lineTo(-20 - flameLen * 0.5, 0);
                ctx.lineTo(-20, 3);
                ctx.fill();
            }

            // Main Body
            ctx.fillStyle = '#cbd5e1';
            ctx.fillRect(-20, -10, 40, 20);
            
            // Cockpit window
            ctx.fillStyle = '#0284c7';
            ctx.beginPath();
            ctx.arc(5, 0, 3.5, 0, Math.PI * 2);
            ctx.fill();

            // Nose Cone
            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.moveTo(20, -10);
            ctx.lineTo(35, 0);
            ctx.lineTo(20, 10);
            ctx.fill();
            
            // Fins
            ctx.fillStyle = '#dc2626';
            ctx.beginPath(); ctx.moveTo(-20, -10); ctx.lineTo(-10, -10); ctx.lineTo(-20, -20); ctx.fill();
            ctx.beginPath(); ctx.moveTo(-20, 10); ctx.lineTo(-10, 10); ctx.lineTo(-20, 20); ctx.fill();

            ctx.restore();
        }

        function physicsStep(dt) {
            const mPrime = parseFloat(inputs.mPrime.value);
            const vex = parseFloat(inputs.vex.value);

            // Sub-stepping Euler Integration
            const steps = 10; 
            const sub_dt = dt / steps;

            for (let i = 0; i < steps; i++) {
                // Determine acceleration
                if (m > emptyMass) {
                    m -= mPrime * sub_dt;
                    a = (vex * mPrime) / m;
                } else {
                    a = 0; // Burnout
                }
                
                // Integrate: a -> v -> x
                v += a * sub_dt;
                x += v * sub_dt;
                t += sub_dt;
            }
        }

        let frameCounter = 0;
        function loop(timestamp) {
            if (!isRunning) {
                lastTime = timestamp;
                drawCanvas();
                requestAnimationFrame(loop);
                return;
            }

            let dt = (timestamp - lastTime) / 1000;
            lastTime = timestamp;
            
            // Prevent huge jumps if tab was unfocused
            if (dt > 0.1) dt = 0.1;
            
            // Advance simulation
            physicsStep(dt);

            // Record and plot every few frames to keep charts performant
            frameCounter++;
            if (frameCounter % 4 === 0) {
                recordData();
                updateCharts();
                updateStats();
            }
            
            drawCanvas();
            requestAnimationFrame(loop);
        }

        // Buttons
        document.getElementById('btnStart').addEventListener('click', () => {
            if (!isRunning) {
                isRunning = true;
                lastTime = performance.now();
            }
        });
        document.getElementById('btnPause').addEventListener('click', () => { isRunning = false; });
        document.getElementById('btnReset').addEventListener('click', resetSim);

        resetSim();
        requestAnimationFrame(loop);
    </script>
</body>
</html>
